<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lava-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="30%" stop-color="#4a2a0a"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#lava-gradient)"/>
  
  <!-- Volcano shape -->
  <path d="M300,450 L400,150 L500,450 Z" fill="#4a4a4a"/>
  <path d="M320,450 L400,180 L480,450 Z" fill="#5a5a5a"/>
  
  <!-- Crater -->
  <ellipse cx="400" cy="180" rx="30" ry="15" fill="#1a1a1a"/>
  
  <!-- Lava flow -->
  <path d="M400,180 Q420,250 430,350 Q435,400 440,450" stroke="#ff4500" stroke-width="8" fill="none" opacity="0.9"/>
  <path d="M400,180 Q380,260 370,360 Q365,410 360,450" stroke="#ff6600" stroke-width="6" fill="none" opacity="0.8"/>
  
  <!-- Lava glow -->
  <circle cx="400" cy="180" r="40" fill="#ff4500" opacity="0.3"/>
  <circle cx="400" cy="180" r="25" fill="#ff6600" opacity="0.4"/>
  
  <!-- Smoke -->
  <ellipse cx="400" cy="120" rx="30" ry="20" fill="#666" opacity="0.4"/>
  <ellipse cx="420" cy="100" rx="25" ry="15" fill="#888" opacity="0.3"/>
  
  <text x="400" y="80" text-anchor="middle" fill="#ff6600" font-family="Arial, sans-serif" font-size="28" font-weight="bold">🌋 Mont Nyiragongo</text>
</svg>