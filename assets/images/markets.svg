<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="market-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#market-bg)"/>
  
  <!-- Market stalls -->
  <rect x="50" y="200" width="120" height="200" fill="#f39c12"/>
  <polygon points="50,200 110,150 170,200" fill="#e74c3c"/>
  
  <rect x="200" y="180" width="120" height="220" fill="#27ae60"/>
  <polygon points="200,180 260,130 320,180" fill="#2ecc71"/>
  
  <rect x="350" y="190" width="120" height="210" fill="#e74c3c"/>
  <polygon points="350,190 410,140 470,190" fill="#c0392b"/>
  
  <rect x="500" y="200" width="120" height="200" fill="#f39c12"/>
  <polygon points="500,200 560,150 620,200" fill="#d68910"/>
  
  <rect x="650" y="185" width="120" height="215" fill="#9b59b6"/>
  <polygon points="650,185 710,135 770,185" fill="#8e44ad"/>
  
  <!-- Fruits/vegetables -->
  <circle cx="80" cy="280" r="12" fill="#e74c3c"/>
  <circle cx="105" cy="280" r="12" fill="#f39c12"/>
  <circle cx="130" cy="280" r="12" fill="#27ae60"/>
  <circle cx="80" cy="310" r="12" fill="#f1c40f"/>
  <circle cx="105" cy="310" r="12" fill="#e67e22"/>
  
  <!-- People silhouettes -->
  <ellipse cx="250" cy="380" rx="15" ry="25" fill="#1a1a2e"/>
  <circle cx="250" cy="350" r="12" fill="#1a1a2e"/>
  <ellipse cx="400" cy="380" rx="15" ry="25" fill="#2c3e50"/>
  <circle cx="400" cy="350" r="12" fill="#2c3e50"/>
  
  <text x="400" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">🛍️ Marchés Locaux</text>
</svg>