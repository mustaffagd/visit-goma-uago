<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="city-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#city-sky)"/>
  
  <!-- Buildings -->
  <rect x="50" y="200" width="60" height="250" fill="#34495e"/>
  <rect x="130" y="150" width="50" height="300" fill="#2c3e50"/>
  <rect x="200" y="180" width="70" height="270" fill="#3d566e"/>
  <rect x="290" y="120" width="55" height="330" fill="#34495e"/>
  <rect x="360" y="160" width="65" height="290" fill="#2c3e50"/>
  <rect x="440" y="140" width="50" height="310" fill="#3d566e"/>
  <rect x="510" y="170" width="60" height="280" fill="#34495e"/>
  <rect x="590" y="190" width="55" height="260" fill="#2c3e50"/>
  <rect x="660" y="150" width="70" height="300" fill="#3d566e"/>
  
  <!-- Windows -->
  <rect x="70" y="220" width="8" height="8" fill="#f1c40f" opacity="0.8"/>
  <rect x="90" y="220" width="8" height="8" fill="#f1c40f" opacity="0.6"/>
  <rect x="110" y="220" width="8" height="8" fill="#f1c40f" opacity="0.9"/>
  <rect x="70" y="250" width="8" height="8" fill="#f1c40f" opacity="0.7"/>
  <rect x="90" y="250" width="8" height="8" fill="#f1c40f" opacity="0.5"/>
  
  <!-- Street -->
  <rect x="0" y="420" width="800" height="80" fill="#1a1a2e"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#f1c40f" stroke-width="2" stroke-dasharray="20,15"/>
  
  <text x="400" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">🏙️ Centre-ville de Goma</text>
</svg>