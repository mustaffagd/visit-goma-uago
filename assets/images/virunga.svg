<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="virunga-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#virunga-sky)"/>
  
  <!-- Dense forest -->
  <path d="M0,280 L100,200 L200,250 L350,180 L500,220 L650,160 L800,200 L800,500 L0,500 Z" fill="#1a5a2a"/>
  <path d="M0,320 L150,260 L300,290 L450,240 L600,270 L800,250 L800,500 L0,500 Z" fill="#2d6a3e"/>
  
  <!-- Gorilla silhouette -->
  <ellipse cx="400" cy="350" rx="40" ry="35" fill="#1a1a1a"/>
  <ellipse cx="400" cy="310" rx="25" ry="22" fill="#1a1a1a"/>
  <circle cx="392" cy="305" r="3" fill="white"/>
  <circle cx="408" cy="305" r="3" fill="white"/>
  
  <!-- Trees -->
  <polygon points="100,300 120,200 140,300" fill="#1a4a2a"/>
  <polygon points="150,320 175,220 200,320" fill="#2d5a27"/>
  <polygon points="600,290 630,190 660,290" fill="#1a4a2a"/>
  <polygon points="650,310 680,210 710,310" fill="#2d5a27"/>
  
  <text x="400" y="150" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="28" font-weight="bold">🦍 Parc des Virunga</text>
</svg>